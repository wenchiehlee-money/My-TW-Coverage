    <!-- Soft Ear Tuft Horns -->
    <path d="M7 6c-1.5-1.5-2.5-1-3 0 0 1.5 1 2.5 2 3" />
    <path d="M17 6c1.5-1.5 2.5-1 3 0 0 1.5-1 2.5-2 3" />
