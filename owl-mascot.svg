    <path d="M12 4C7 4 4 7 4 13c0 4.5 3.5 8 8 8s8-3.5 8-8c0-6-3-9-8-9z" />
    <!-- Left & Right Cute Flapping Wing Nubs -->
    <path d="M4 12c-1.5 2-1 4.5 1 6" />
    <path d="M20 12c1.5 2 1 4.5-1 6" />
    <!-- Big Cute Eyes -->
    <circle cx="8.5" cy="11" r="2.5" />
    <circle cx="15.5" cy="11" r="2.5" />
    <!-- Curious Pupils -->
    <path d="M8.5 10.5v1" stroke-width="2.2" />
    <path d="M15.5 10.5v1" stroke-width="2.2" />
    <!-- Cute Small Beak -->
    <path d="m11.2 13 1 1.8 1-1.8" />
    <!-- Tiny Feet -->
    <path d="M8.5 21v1" />
    <path d="M15.5 21v1" />
  </symbol>
