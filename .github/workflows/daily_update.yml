name: Daily Update Financials & Valuation

on:
  schedule:
    # 每天 UTC 19:00 (台灣時間凌晨 03:00) 執行一次
    - cron: '0 19 * * *'
  workflow_dispatch: # 允許手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Pushes made with the default GITHUB_TOKEN don't trigger other
          # workflows' `on: push` (GitHub's anti-recursion rule), which would
          # silently stop sync_to_googlealertmanager.yml from ever firing.
          # Using a PAT here makes the later "git push" count as a normal
          # actor push so downstream push-triggered workflows still run.
          token: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY }}

      - name: Clone biztrends.TW (read-only, outside this git worktree)
        env:
          GH_PAT: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${GH_PAT}@github.com/wenchiehlee-money/biztrends.TW.git" \
            "${{ runner.temp }}/biztrends.TW"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Must run before Update Financials/Valuation: it rewrites every company
      # page in output/themes/company/ from data/enrichment_all/*.json's frozen
      # financial_md snapshot. For real TW tickers that snapshot is stale (their
      # JSON's source_md still points at the pre-refactor Pilot_Reports path) --
      # only concept-stock tickers (e.g. SIMO/MRVL, whose JSON is the actual
      # source of truth) need this render. Running it first, then letting
      # Update Financials/Valuation write real yfinance data on top, means the
      # fresh numbers survive; running it last (as before) clobbered every TW
      # ticker's just-updated quarter back to whatever was last baked into JSON.
      - name: Render enrichment Markdown + competitor JSON
        run: |
          python skills/skill-company-enrichment-render/scripts/render_enrichment_markdown.py \
            --json-dir data/enrichment_all \
            --out output/themes/company \
            --compare output/enrichment_all_render_compare.csv \
            --biztrends-root "${{ runner.temp }}/biztrends.TW" \
            --segment-weights "${{ runner.temp }}/biztrends.TW/data/company_segment_weights.csv" \
            --monthly-revenue "${{ runner.temp }}/biztrends.TW/data/Python-Actions.GoodInfo.Analyzer/raw_revenue.csv"

      - name: Run Update Financials
        run: python scripts/update_financials.py

      - name: Run Update Valuation
        run: python scripts/update_valuation.py

      - name: Rebuild Wikilink Index
        run: python scripts/build_wikilink_index.py

      - name: Rebuild Themes Value Chain
        run: python skills/skill-company-enrichment-render/scripts/build_themes.py

      - name: Rebuild Network Graph
        run: python scripts/build_network.py

      - name: Run Quality Audit
        run: python scripts/audit_batch.py --all -v

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update financial data, valuation, and generated indexes"
            git push
          else
            echo "No changes to commit."
          fi
