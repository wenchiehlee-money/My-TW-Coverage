name: Daily Update Financials & Valuation

on:
  schedule:
    # 每天分 4 個時段執行，約相隔 3 小時；讓 FinMind quota 重置後逐次補齊。
    # 台灣時間：01:00、04:00、07:00、10:00。
    - cron: '0 17 * * *'
    - cron: '0 20 * * *'
    - cron: '0 23 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch: # 允許手動觸發

concurrency:
  group: daily-update-financials-valuation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Pushes made with the default GITHUB_TOKEN don't trigger other
          # workflows' `on: push` (GitHub's anti-recursion rule), which would
          # silently stop sync_to_googlealertmanager.yml from ever firing.
          # Using a PAT here makes the later "git push" count as a normal
          # actor push so downstream push-triggered workflows still run.
          token: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY }}

      - name: Clone biztrends.TW (read-only, outside this git worktree)
        env:
          GH_PAT: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${GH_PAT}@github.com/wenchiehlee-money/biztrends.TW.git" \
            "${{ runner.temp }}/biztrends.TW"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Traditional Chinese chart font
        run: |
          curl -L --fail --silent --show-error --retry 3 \
            -o "${{ runner.temp }}/NotoSansCJKtc-Regular.otf" \
            "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf"
          echo "TW_CJK_FONT=${{ runner.temp }}/NotoSansCJKtc-Regular.otf" >> "$GITHUB_ENV"

      # Generate charts before rendering company Markdown. Analyzer is the
      # preferred monthly-revenue source; FinMind fills missing months.
      - name: Render dynamic valuation charts
        id: render_charts
        continue-on-error: true
        env:
          FINMIND_TOKEN1: ${{ secrets.FINMIND_TOKEN1 }}
          FINMIND_TOKEN2: ${{ secrets.FINMIND_TOKEN2 }}
          FINMIND_TOKEN3: ${{ secrets.FINMIND_TOKEN3 }}
          FINMIND_TOKEN4: ${{ secrets.FINMIND_TOKEN4 }}
          FINMIND_TOKEN5: ${{ secrets.FINMIND_TOKEN5 }}
          FINMIND_TOKEN6: ${{ secrets.FINMIND_TOKEN6 }}
          FINDMIND_GMAIL_TOKEN1: ${{ secrets.FINDMIND_GMAIL_TOKEN1 }}
          FINDMIND_GMAIL_TOKEN2: ${{ secrets.FINDMIND_GMAIL_TOKEN2 }}
          FINDMIND_GMAIL_TOKEN3: ${{ secrets.FINDMIND_GMAIL_TOKEN3 }}
          FINDMIND_GMAIL_TOKEN4: ${{ secrets.FINDMIND_GMAIL_TOKEN4 }}
          FINDMIND_GMAIL_TOKEN5: ${{ secrets.FINDMIND_GMAIL_TOKEN5 }}
        run: |
          python skills/skill-stock-dynamic-valuation-box/scripts/render_dynamic_valuation_batch.py \
            --json-dir data/enrichment_all \
            --output-dir output/dynamic_valuation_box \
            --analyzer-revenue-csv "${{ runner.temp }}/biztrends.TW/data/Python-Actions.GoodInfo.Analyzer/raw_revenue.csv" \
            --finmind-revenue-csv "${{ runner.temp }}/biztrends.TW/data/Python-Actions.FinMind/raw_revenue.csv" \
            --finmind-financial-ratio-csv "${{ runner.temp }}/biztrends.TW/data/Python-Actions.FinMind/raw_fin_ratio_quarter.csv" \
            --yahoo-consensus-csv "${{ runner.temp }}/biztrends.TW/data/Yahoo.Finance/raw_yahoo_finance_consensus_daily.csv" \
            --factset-report-csv "${{ runner.temp }}/biztrends.TW/data/Yahoo.Finance/raw_factset_detailed_report.csv" \
            --years 3 \
            --max-age-days 3 \
            --failure-log output/dynamic_valuation_box_failures.tsv \
            --deferred-log output/dynamic_valuation_box_deferred_quota.tsv \
            --queue-state output/dynamic_valuation_box_queue_state.json \
            --workers 2

      # Regenerate non-Taiwan charts from the local Yahoo/ConceptStocks feeds.
      - name: Render international dynamic valuation charts
        env:
          INTERNATIONAL_PRICE_CSV: ${{ runner.temp }}/biztrends.TW/data/Yahoo.Finance/raw_yahoo_finance_daily_price.csv
          INTERNATIONAL_INCOME_CSV: ${{ runner.temp }}/biztrends.TW/data/ConceptStocks/raw_conceptstock_company_income.csv
          YAHOO_CONSENSUS_CSV: ${{ runner.temp }}/biztrends.TW/data/Yahoo.Finance/raw_yahoo_finance_consensus_daily.csv
          FACTSET_REPORT_CSV: ${{ runner.temp }}/biztrends.TW/data/Yahoo.Finance/raw_factset_detailed_report.csv
        run: |
          INTERNATIONAL_SYMBOLS=$(python - <<'PY'
          import json
          import sys
          from pathlib import Path
          import pandas as pd
          price_path=Path("${{ runner.temp }}/biztrends.TW/data/Yahoo.Finance/raw_yahoo_finance_daily_price.csv")
          income_path=Path("${{ runner.temp }}/biztrends.TW/data/ConceptStocks/raw_conceptstock_company_income.csv")
          price_symbols=set(pd.read_csv(price_path, usecols=["stock_code"], dtype=str)["stock_code"].str.upper())
          income_symbols=set(pd.read_csv(income_path, usecols=["symbol"], dtype=str)["symbol"].str.upper())
          symbols=[]; missing=[]
          for path in sorted(Path("data/enrichment_all").glob("*.json")):
              try:
                  ticker=str(json.loads(path.read_text(encoding="utf-8")).get("ticker", "")).strip()
              except (OSError, ValueError):
                  continue
              if ticker and not ticker.isdigit():
                  if ticker.upper() in price_symbols and ticker.upper() in income_symbols:
                      symbols.append(ticker)
                  else:
                      missing.append(ticker)
          if missing:
              print("International charts skipped due to missing local price/income source: " + ", ".join(missing), file=sys.stderr, flush=True)
          print(" ".join(symbols))
          PY
          )
          if [ -n "$INTERNATIONAL_SYMBOLS" ]; then
            python skills/skill-stock-dynamic-valuation-box/scripts/render_international_valuation_box.py \
              --symbols $INTERNATIONAL_SYMBOLS \
              --price-csv "$INTERNATIONAL_PRICE_CSV" \
              --income-csv "$INTERNATIONAL_INCOME_CSV" \
              --yahoo-consensus-csv "$YAHOO_CONSENSUS_CSV" \
              --factset-report-csv "$FACTSET_REPORT_CSV" \
              --output-dir output/dynamic_valuation_box \
              --json-dir data/enrichment_all \
              --years 3
          fi

      - name: Build valuation chart health manifest
        if: always()

        id: chart_health
        continue-on-error: true
        run: |
          python scripts/build_dynamic_valuation_health.py \
            --json-dir data/enrichment_all \
            --chart-dir output/dynamic_valuation_box \
            --output output/dynamic_valuation_box_health.csv \
            --max-age-days 3

      # Must run before Update Financials/Valuation: it rewrites every company
      # page in output/themes/company/ from data/enrichment_all/*.json's frozen
      # financial_md snapshot. For real TW tickers that snapshot is stale (their
      # JSON's source_md still points at the pre-refactor Pilot_Reports path) --
      # only concept-stock tickers (e.g. SIMO/MRVL, whose JSON is the actual
      # source of truth) need this render. Running it first, then letting
      # Update Financials/Valuation write real yfinance data on top, means the
      # fresh numbers survive; running it last (as before) clobbered every TW
      # ticker's just-updated quarter back to whatever was last baked into JSON.
      - name: Render enrichment Markdown + competitor JSON
        if: github.event_name != 'schedule' || github.event.schedule == '0 17 * * *'
        run: |
          python skills/skill-company-enrichment-render/scripts/render_enrichment_markdown.py \
            --json-dir data/enrichment_all \
            --out output/themes/company \
            --compare output/enrichment_all_render_compare.csv \
            --biztrends-root "${{ runner.temp }}/biztrends.TW" \
            --segment-weights "${{ runner.temp }}/biztrends.TW/data/company_segment_weights.csv" \
            --monthly-revenue "${{ runner.temp }}/biztrends.TW/data/Python-Actions.GoodInfo.Analyzer/raw_revenue.csv"

      - name: Run Update Financials
        if: github.event_name != 'schedule' || github.event.schedule == '0 17 * * *'
        run: python scripts/update_financials.py

      - name: Run Update Valuation
        if: github.event_name != 'schedule' || github.event.schedule == '0 17 * * *'
        run: python scripts/update_valuation.py

      - name: Rebuild Wikilink Index
        if: github.event_name != 'schedule' || github.event.schedule == '0 17 * * *'
        run: python scripts/build_wikilink_index.py

      - name: Rebuild Themes Value Chain
        if: github.event_name != 'schedule' || github.event.schedule == '0 17 * * *'
        run: python skills/skill-company-enrichment-render/scripts/build_themes.py

      - name: Rebuild Network Graph
        if: github.event_name != 'schedule' || github.event.schedule == '0 17 * * *'
        run: python scripts/build_network.py

      - name: Run Quality Audit
        if: github.event_name != 'schedule' || github.event.schedule == '0 17 * * *'
        run: python scripts/audit_batch.py --all -v


      - name: Commit and push changes
        id: commit_push
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          {
            echo "### Generated artifact summary"
            if [ -f output/dynamic_valuation_box_run_summary.json ]; then
              cat output/dynamic_valuation_box_run_summary.json
            fi
            echo "cached_svg=$(git diff --cached --name-only | grep -E "_dynamic_valuation_box_3y\.svg$" | wc -l)"
            echo "cached_png=$(git diff --cached --name-only | grep -E "_dynamic_valuation_box_3y\.png$" | wc -l)"
            echo "cached_csv=$(git diff --cached --name-only | grep -E "_dynamic_valuation_box_3y\.csv$" | wc -l)"
            echo "cached_company_markdown=$(git diff --cached --name-only -- output/themes/company | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update financial data, valuation, and generated indexes"
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push; then
                pushed=true
                break
              fi
              echo "Push rejected (attempt $attempt/5); refreshing from latest master..."
              git fetch origin master
              git reset --mixed origin/master
              git add .
              if git diff --cached --quiet; then
                pushed=true
                break
              fi
              git commit -m "Auto-update financial data, valuation, and generated indexes"
              sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "Unable to push generated artifacts after 5 attempts." >&2
              exit 1
            fi
          else
            echo "No changes to commit."
          fi
      - name: Report partial-update warnings
        if: always()
        run: |
          if [ "${{ steps.commit_push.outcome }}" = "failure" ]; then
            echo "Artifact commit/push failed; this run is failed." >&2
            exit 1
          fi
          deferred=0
          if [ -f output/dynamic_valuation_box_deferred_quota.tsv ]; then
            deferred=$(tail -n +2 output/dynamic_valuation_box_deferred_quota.tsv | sed /^[[:space:]]*$/d | wc -l)
          fi
          if [ "$deferred" -gt 0 ]; then
            echo "Partial chart backfill committed; deferred_due_to_quota=$deferred."
          elif [ "${{ steps.render_charts.outcome }}" = "failure" ] || [ "${{ steps.chart_health.outcome }}" = "failure" ]; then
            echo "Partial update committed successfully; unfinished or stale stocks remain in the health artifact."
          else
            echo "Update and artifact commit/push completed successfully."
          fi
      - name: Fail if chart rendering or health check failed
        if: steps.render_charts.outcome == 'failure' || steps.chart_health.outcome == 'failure'
        run: |
          echo "Chart rendering or chart health failed; generated partial artifacts were committed before failing."
          exit 1
